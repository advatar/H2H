# Test deployment only. Requires operator-managed remote TLS PostgreSQL and OAuth issuer.
# Read docs/DEPLOYMENT.md. Never commit .env or use this as a compliance baseline.
services:
  slack:
    build: .
    command: ["npm","run","slack"]
    env_file:
      - .env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
  mcp:
    build: .
    command: ["npm","run","mcp"]
    env_file:
      - .env
    environment:
      H2H_LISTEN_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
