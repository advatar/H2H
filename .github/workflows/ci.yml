name: H2H reference conformance
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run demo > /dev/null
